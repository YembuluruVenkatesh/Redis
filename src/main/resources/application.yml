spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/productdb}
    username: ${SPRING_DATASOURCE_USERNAME:springuser}
    password: ${SPRING_DATASOURCE_PASSWORD:spring123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

logging:
  level:
     root: WARN
     com.example.productservice: INFO
    #org.springframework.cache: TRACE
    #org.springframework.data.redis: DEBUG
    #org.hibernate.SQL: DEBUG
    #org.hibernate.orm.jdbc.bind: TRACE